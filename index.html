<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zia ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Layout: fixed ledger sidebar + scrolling work area; sidebar collapses to a top tab strip on phones */
:root{
  --bg:#f3f4f9; --surface:#ffffff; --surface-2:#f8f9fc; --ink:#1a1d38; --muted:#5d6286; --line:#e0e2ee;
  --brand:#2e3a8c; --brand-ink:#ffffff; --brand-soft:#e7e9f7; --accent:#a86a12; --accent-soft:#f7ecd9;
  --good:#1d7a4c; --good-soft:#e2f3ea; --warn:#a85a06; --warn-soft:#fbeedd; --bad:#b42318; --bad-soft:#fbe6e4;
  --info:#2563a8; --info-soft:#e3eefa; --shadow:0 1px 2px rgba(26,29,56,.06),0 8px 24px rgba(26,29,56,.06);
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif; --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1120; --surface:#171a2d; --surface-2:#1c2036; --ink:#e7e8f3; --muted:#9a9fc2; --line:#2a2e48;
  --brand:#8f9bff; --brand-ink:#0f1120; --brand-soft:#252a5a; --accent:#e2aa55; --accent-soft:#3a2d17;
  --good:#52c28b; --good-soft:#15352a; --warn:#f0a847; --warn-soft:#3a2a12; --bad:#f2786d; --bad-soft:#3d1c1b;
  --info:#6fb0f5; --info-soft:#15294a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1120; --surface:#171a2d; --surface-2:#1c2036; --ink:#e7e8f3; --muted:#9a9fc2; --line:#2a2e48;
  --brand:#8f9bff; --brand-ink:#0f1120; --brand-soft:#252a5a; --accent:#e2aa55; --accent-soft:#3a2d17;
  --good:#52c28b; --good-soft:#15352a; --warn:#f0a847; --warn-soft:#3a2a12; --bad:#f2786d; --bad-soft:#3d1c1b;
  --info:#6fb0f5; --info-soft:#15294a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brandmark{display:flex;align-items:center;gap:10px;padding:0 8px}
.brandmark .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 16px var(--f-display)}
.brandmark b{font:600 17px var(--f-display);display:block;line-height:1.1}
.brandmark small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.nav .count{font:500 11px var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:99px}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{padding-block:24px 60px;padding-inline:clamp(16px,3vw,36px);min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head h1{font-size:26px;font-weight:600}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 22px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.hide-cost .cost,.hide-profit .profit{display:none!important}
.kpi-btn{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.kpi-btn:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.kpi-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kpi .v.warn{color:var(--warn)}
.kpi.pos .v{color:var(--good)} .kpi.neg .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:16px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 small{font:400 12px var(--f-body);color:var(--muted)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel .tw{border:0;border-radius:0;margin:0 -16px -16px;background:transparent}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
tfoot td{font-weight:600;background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-good{background:var(--good-soft);color:var(--good)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-brand{background:var(--brand-soft);color:var(--brand)} .t-mute{background:var(--surface-2);color:var(--muted)} .t-accent{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;min-width:0;width:240px;max-width:100%}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-display);margin-bottom:4px}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card .top{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.card b{font-weight:600}
.card .items{font-size:12.5px;color:var(--muted)}
.card.late{border-left:3px solid var(--bad)}
/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:7px;background:var(--surface-2);border-radius:99px;margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:99px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pipe div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.pipe b{display:block;font:600 22px var(--f-display)}
.pipe span{font-size:11.5px;color:var(--muted)}
/* pl */
.pl td{padding:7px 12px}
.pl .sec td{font-weight:600;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pl .tot td{font-weight:600;border-top:2px solid var(--line)}
.pl .big td{font:600 17px var(--f-display)}
.pl .ind td:first-child{padding-left:26px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(860px,100%);display:flex;flex-direction:column}
.modal.narrow{width:min(520px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-size:18px;font-weight:600}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.li input,.li select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink);min-width:0;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus,.li input:focus,.li select:focus,.search:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
.sugg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sugg:empty{display:none}
.sugg button{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:500}
.sugg button:hover,.sugg button:focus-visible{border-color:var(--brand);color:var(--brand);outline:none}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.lines table td{padding:5px 6px} .lines table th{padding:8px 6px}
.lines .li input{padding:5px 7px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 18px;justify-self:end;min-width:240px;font-variant-numeric:tabular-nums}
.sum .g{font:600 16px var(--f-display);border-top:1px solid var(--line);padding-top:6px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:9px 12px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.done{background:var(--brand-soft);color:var(--brand)}
.steps span.cur{background:var(--brand);color:var(--brand-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow)}
.dl{display:grid;align-content:start;margin:0;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-size:13px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line);z-index:20;overflow:visible}
  .brandmark small,.sync span{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;padding:7px 10px}
  .sync{margin:0}
  .head h1{font-size:22px}
  .pipe{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}}}
</style>
<style>
.auth-gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.auth-card .logo{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 20px var(--f-display)}
.auth-card h1{font-size:22px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-msg{font-size:13px;color:var(--muted);min-height:1em}.auth-msg.bad{color:var(--bad)}
.auth-switch{font-size:13px;color:var(--muted)}
.auth-switch button{all:unset;cursor:pointer;color:var(--brand);font-weight:500}
.who{font-size:12px;color:var(--muted);padding:0 10px;display:flex;flex-direction:column;gap:4px}
.who button{all:unset;cursor:pointer;color:var(--brand);font-weight:500}
@media (max-width:820px){.who{display:none}}
</style>
</head>
<body>


<div class="app">
  <aside class="side">
    <div class="brandmark"><div class="logo" id="logo">Z</div><div><b id="bizName">Zia</b><small>Clothing ERP</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="whoami" hidden><span>Signed in as <b id="whoName"></b></span><button id="signOut" type="button">Sign out</button></div>
    <div class="sync" style="margin-top:8px"><i class="dot" id="syncDot"></i><span id="syncTxt">Connecting…</span></div>
  </aside>
  <main id="main">
    <div class="empty"><b>Loading your business records</b>Stock, orders and accounts appear here in a moment.</div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>


<div class="auth-gate" id="authGate" hidden>
  <div class="auth-card">
    <div class="logo">Z</div>
    <div><h1 id="authTitle">Sign in</h1><p class="muted" style="margin:4px 0 0">Clothing ERP</p></div>
    <form id="authForm">
      <label class="f" id="authNameRow" hidden>Your name<input id="authName" autocomplete="name"></label>
      <label class="f">Email<input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="f" id="authPassRow">Password<input id="authPass" type="password" autocomplete="current-password" minlength="6"></label>
      <button class="btn primary" id="authSubmit" type="submit" style="justify-content:center;padding:10px">Sign in</button>
    </form>
    <div class="auth-msg" id="authMsg"></div>
    <div class="auth-switch" id="authSwitch"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="supa-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
